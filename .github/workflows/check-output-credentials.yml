name: check-output-credentials

# Tiny manual probe: proves PRIVATE_OUTPUT_TOKEN can write a release to the private
# output repository, without spending a full compile. Manually triggered only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe-private-release-write
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Probe the private output credential
        shell: pwsh
        env:
          PRIVATE_OUTPUT_TOKEN: ${{ secrets.PRIVATE_OUTPUT_TOKEN }}
          PRIVATE_OUTPUT_REPO: ${{ secrets.PRIVATE_OUTPUT_REPO }}
        run: ./scripts/check-output-credentials.ps1
