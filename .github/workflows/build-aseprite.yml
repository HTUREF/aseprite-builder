name: build-aseprite-windows-x64

# Manually triggered only.
# There is deliberately NO push / pull_request / pull_request_target / workflow_run
# trigger: this job receives a credential for a private repository, so it must never
# be reachable by code that a third party can influence.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified ZIP + manifest to the private output repository"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: aseprite-windows-x64
  cancel-in-progress: false

env:
  ASEPRITE_REPO: aseprite/aseprite
  ASEPRITE_TAG: v1.3.18.6
  ASEPRITE_SHA: 331e898ef405d919539c03fd1675691cfa16c3a3
  SKIA_TAG: m124-08a5439a6b
  SKIA_ASSET: Skia-Windows-Release-x64.zip
  SKIA_SHA256: 5a371a4b2819bb4eb96e36cd75fa623585e1d5477e253a970302b6f2471b6934
  BUILD_TYPE: RelWithDebInfo
  BUILD_PARALLEL: "4"

jobs:
  build-windows-x64:
    name: build-aseprite-windows-x64
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------------ 01
      - name: "01 Checkout builder repo"
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ 02
      - name: "02 Preflight: runner facts, toolchain, disk"
        shell: pwsh
        run: ./scripts/preflight.ps1

      # ------------------------------------------------------------------ 02b
      - name: "02b Validate output credentials (fail fast, before compiling)"
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          PRIVATE_OUTPUT_TOKEN: ${{ secrets.PRIVATE_OUTPUT_TOKEN }}
          PRIVATE_OUTPUT_REPO: ${{ secrets.PRIVATE_OUTPUT_REPO }}
        run: ./scripts/check-output-credentials.ps1

      # ------------------------------------------------------------------ 03
      - name: "03 Reclaim disk only if free space is low"
        shell: pwsh
        run: ./scripts/reclaim-disk.ps1

      # ------------------------------------------------------------------ 04
      - name: "04 Fetch pinned Aseprite source with recursive submodules"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ASEPRITE_REPO }}
          ref: ${{ env.ASEPRITE_TAG }}
          path: src-aseprite
          submodules: recursive
          fetch-depth: 1

      # ------------------------------------------------------------------ 05
      - name: "05 Verify source pin and submodules"
        shell: pwsh
        run: ./scripts/verify-source.ps1

      # ------------------------------------------------------------------ 06
      - name: "06 Download + verify the official prebuilt Skia"
        shell: pwsh
        run: ./scripts/fetch-skia.ps1

      # ------------------------------------------------------------------ 07
      - name: "07 CMake configure (Ninja, RelWithDebInfo, Skia, Lua)"
        shell: pwsh
        run: ./scripts/configure.ps1

      # ------------------------------------------------------------------ 08
      - name: "08 Build target aseprite with --parallel 4"
        shell: pwsh
        run: ./scripts/build.ps1

      # ------------------------------------------------------------------ 09
      - name: "09 Verify binary: arch, version, Lua, clean-dir startup"
        shell: pwsh
        run: ./scripts/verify-build.ps1

      # ------------------------------------------------------------------ 10
      - name: "10 Package ZIP + manifest + SHA-256"
        shell: pwsh
        run: ./scripts/package.ps1

      # ------------------------------------------------------------------ 11
      - name: "11 Publish to PRIVATE output repository"
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          PRIVATE_OUTPUT_TOKEN: ${{ secrets.PRIVATE_OUTPUT_TOKEN }}
          PRIVATE_OUTPUT_REPO: ${{ secrets.PRIVATE_OUTPUT_REPO }}
        run: ./scripts/publish.ps1

      # ------------------------------------------------------------------ 12
      - name: "12 Job summary"
        if: always()
        shell: pwsh
        run: ./scripts/summary.ps1
